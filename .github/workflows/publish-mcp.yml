name: Publish MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'packages/mcp-server/**'
      - 'packages/contracts/**'
  workflow_dispatch:

# Trusted Publishing (OIDC) — không cần NPM_TOKEN secret
permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      - name: Use latest npm (trusted publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build contracts artifacts (bundled registry data)
        working-directory: packages/contracts
        run: |
          npm run generate
          npm run build:artifact

      - name: Build MCP server (bundles data + sources)
        working-directory: packages/mcp-server
        run: npm run build

      - name: Check version not already published
        run: |
          VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          if npm view "@galaxy-stack/nebula-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published — skipping publish"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "Publishing new version $VERSION"
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish
        if: env.SHOULD_PUBLISH == 'true'
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
