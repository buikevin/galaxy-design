# Smithery configuration for the Galaxy UI MCP server.
# The npm package (@galaxy-stack/design-mcp) bundles all component data,
# so users need zero local setup — npx pulls and launches it.

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({ "command": "npx", "args": ["-y", "@galaxy-stack/design-mcp"] })
